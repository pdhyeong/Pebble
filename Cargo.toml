[workspace]
members = ["src-tauri", "crates/pebble-core", "crates/pebble-cli"]
default-members = ["crates/pebble-core", "crates/pebble-cli"]
resolver = "2"

[workspace.dependencies]
pebble-core = { path = "crates/pebble-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
dirs = "5"
libp2p = { version = "0.52", features = ["tokio", "tcp", "quic", "dns", "mdns", "noise", "yamux", "macros", "identify", "ping", "request-response"] }
futures = "0.3"
